<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1580" viewBox="0 0 2200 1580" role="img" aria-labelledby="title desc">
<title id="title">Crucible high-level system design and technology stack</title>
<desc id="desc">System architecture showing four user roles, React and TypeScript web frontends, FastAPI Python backend capability modules, isolated code execution, SQLite module stores, evidence ledger, consent-gated recording and optional AI provider. The current topology is one modular FastAPI process.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#edf8f5"/></linearGradient>
